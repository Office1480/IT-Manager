# Environnement local complet : `docker compose up -d`
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: itmanager
      POSTGRES_PASSWORD: itmanager
      POSTGRES_DB: itmanager
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itmanager"]
      interval: 5s
      retries: 10

  app:
    build: .
    profiles: ["app"]
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://itmanager:itmanager@db:5432/itmanager?schema=public
      STORAGE_DIR: /data/storage
    ports:
      - "3000:3000"
    volumes:
      - storage:/data/storage

volumes:
  pgdata:
  storage:
